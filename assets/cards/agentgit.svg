<svg xmlns="http://www.w3.org/2000/svg" width="384" height="214" viewBox="0 0 384 214"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151c33"/><stop offset="1" stop-color="#0c1220"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".55"/><stop offset=".5" stop-color="#334155" stop-opacity=".6"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".55"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".13"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient><clipPath id="c"><rect x="6" y="6" width="372" height="202" rx="16"/></clipPath></defs><rect x="6" y="6" width="372" height="202" rx="16" fill="url(#bg)"/><circle cx="344" cy="30" r="130" fill="url(#glow)" clip-path="url(#c)"/><rect x="6.5" y="6.5" width="371" height="201" rx="16" fill="none" stroke="url(#edge)"/><rect x="26" y="26" width="44" height="44" rx="12" fill="#2dd4bf" fill-opacity=".09" stroke="#2dd4bf" stroke-opacity=".25"/><g transform="translate(35 35) scale(1.0833333333333333)" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10"/><path d="M18 9c0 4.500-12 3-12 8" stroke="#a78bfa"/></g><text x="84" y="46" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="19" fill="#f1f5f9" font-weight="600">AgentGit</text><text x="84" y="66" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5eead4">Completed pet project for Cresta</text><text x="26" y="100" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13.5" fill="#b0bbcd">A voice agent as a git repo. An AI composer makes</text><text x="26" y="119" font-family="'Segoe UI',-apple-system,Blink